aid: idwall
name: IDwall
description: >-
  IDwall (idwall.co) is a Brazilian identity verification, KYC, and anti-fraud
  platform. Its REST API lets companies run background checks and consult public
  data sources, validate documents such as the CNH (Brazilian driver's license),
  assemble verification reports (relatorios) from configurable matrices
  (matrizes), retrieve previously queried people (pessoas), and receive webhook
  notifications when a report's status changes. Authentication is a per-account
  API token passed in the Authorization header; the production base URL is
  https://api-v2.idwall.co and all responses are JSON. There is no sandbox -
  contracted tokens run against production. IDwall was backed by 500 Global and
  GGV Capital.
